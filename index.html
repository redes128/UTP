 SEMILLA.slice().sort((a,b)=>(a[0]+a[1]).localeCompare(b[0]+b[1])).forEach(([f,a,b])=>{const l=estimar(f,mins(a),mins(b),AV);guardarJornada(f,mins(a),mins(b),l)});
 LS.s('mc_seed',1);
}

/* ---------- Firestore (opcional) ---------- */
const Wq=f=>F?f():ops.push(f),fail=e=>toast('No se guardó en la nube ('+(e.code||e)+')');
function sync_(jid){Wq(()=>{const j=J[jid];if(!j)return F.deleteDoc(F.doc(F.db,'meca_jornadas',jid)).catch(fail);const vis=Object.values(AV).filter(v=>v.j===jid);return F.setDoc(F.doc(F.db,'meca_jornadas',jid),{...j,vis}).catch(fail)})}
function syncSueltas(){Wq(()=>F.setDoc(F.doc(F.db,'meca_jornadas','_sueltas'),{id:'_sueltas',vis:Object.values(AV).filter(v=>!v.j)}).catch(fail))}
window.fbReady=f=>{F=f;ops.splice(0).forEach(o=>o());
 F.onSnapshot(F.collection(F.db,'meca_jornadas'),{includeMetadataChanges:true},s=>{pend=s.metadata.hasPendingWrites;cache=s.metadata.fromCache;status();
  if(s.empty&&s.metadata.fromCache)return;if(s.empty){Object.keys(J).forEach(sync_);syncSueltas();return}
  const j={},v={};s.forEach(x=>{const d=x.data();(d.vis||[]).forEach(a=>v[a.id]=a);if(x.id!=='_sueltas'){const{vis,...rest}=d;j[x.id]=rest}});J=j;AV=v;keep();derive()},()=>{cache=true;status('Sin permiso')})};
window.fbConfig=()=>FB_CONFIG||LS.g('mc_fb',null);

/* ---------- acciones ---------- */
function quitarAula(id){const v=AV[id];if(!v)return;delete AV[id];if(v.j&&J[v.j])J[v.j].ids=J[v.j].ids.filter(x=>x!==id);keep();v.j?sync_(v.j):syncSueltas();derive();toast('Aula quitada')}
function confirmar(id){const v=AV[id];if(!v)return;v.est=!v.est;keep();v.j?sync_(v.j):syncSueltas();render()}
function marcarSuelta(id){const r=R[id];AV[id]={id,n:r.n,j:null,t:new Date().toISOString(),est:false};keep();syncSueltas();derive();toast('Aula '+r.aula+' marcada',[['Deshacer',()=>quitarAula(id)]])}
function borrarJornada(jid){if(!confirm('¿Borrar esta jornada y sus aulas?'))return;Object.keys(AV).forEach(k=>{if(AV[k].j===jid)delete AV[k]});delete J[jid];keep();sync_(jid);derive()}
function recalcular(jid){const j=J[jid];const l=estimar(j.fecha,j.ini,j.fin,sinJ(jid));guardarJornada(j.fecha,j.ini,j.fin,l,jid);toast('Jornada recalculada')}
function cambiarOpen(id){
 const v=AV[id],r=R[id],t=v.slot??r.ini,base=Object.fromEntries(Object.entries(AV).filter(([k])=>+k!==id)),E=estado(base);
 const L=R.filter(x=>x.dow===r.dow&&enClase(x,t)&&!base[x.id]).map(x=>({x,g:gainCon(x,E)})).sort((a,b)=>b.g-a.g).slice(0,12);
 altCtx={id,t};$('#altT').textContent='Cambiar aula · '+hm(t);$('#altS').textContent='Clases en curso a esa hora. Elige la que visitaste.';
 $('#altL').innerHTML=L.map(({x,g})=>clase(x,{pick:1,g})).join('')||'<div class="e">No hay otras clases a esa hora.</div>';$('#sAlt').classList.add('o');
}
function cambiar(nid){const{id,t}=altCtx,v=AV[id];delete AV[id];const r=R[nid];AV[nid]={id:nid,n:r.n,j:v.j,t:v.t,slot:t,est:false};if(v.j&&J[v.j])J[v.j].ids=J[v.j].ids.map(x=>x===id?nid:x);keep();v.j?sync_(v.j):syncSueltas();closeS();derive();toast('Aula cambiada')}

/* ---------- piezas ---------- */
const chipC=ci=>`<span class="chip" style="background:${CC[ci%CC.length]}1f;color:${CC[ci%CC.length]}">${esc(DATA.CN[ci])}</span>`;
function clase(r,o={}){
 const v=AV[r.id],cub=!v&&U.covG.has(r.gk),t=nowM(),now=r.dow===new Date().getDay()&&r.ini<=t&&r.fin>t,g=o.g??gain(r);
 let tg=chipC(r.ci)+`<span class="chip">${esc(r.cur)}.º sem</span>`;if(r.tg)tg+=`<span class="chip">${esc(r.tg)}</span>`;
 if(v)tg+=v.est?'<span class="chip est">Estimada</span>':'<span class="chip ok">Visitada</span>';else if(cub)tg+='<span class="chip ok">Grupo cubierto</span>';
 if(now&&!o.pick)tg+='<span class="chip now">En clase</span>';
 const ac=o.pick?`<button class="c" onclick="cambiar(${r.id})">${ic('check',16,2.5)} Esta fue</button>`:v?`<button onclick="quitarAula(${r.id})">${ic('x',15)} Quitar</button>`:`<button class="p" onclick="marcarSuelta(${r.id})">${ic('check',16,2.5)} Visitada</button>`;
 return `<div class="cl${v||cub?' vis':''}" style="--k:${CC[r.ci%CC.length]}"><div class="t"><b>${hm(r.ini)}–${hm(r.fin)}</b>${tg}<span class="sp">${r.n} est.${!v&&!cub?' · <b>+'+fmt(g)+'</b>':''}</span></div>
 <div class="a1">Aula ${esc(r.aula)}</div><div class="m1">${esc(r.mat)} · Gr. ${esc(r.gr)}</div><div class="m2">${esc(r.doc)}</div><div class="ac">${ac}</div></div>`;
}

/* ---------- RESUMEN ---------- */
function vRes(){
 const nA=Object.keys(AV).length,nJ=Object.keys(J).length,hrs=Object.values(J).reduce((s,j)=>s+(j.fin-j.ini),0)/60;
 const pct=TOT?U.tot/TOT*100:0;
 let h=`<div class="kp"><div class="hl"><b>${fmt(U.tot)}</b><span>estudiantes alcanzados de ${fmt(TOT)} · ${Math.round(pct)}%</span></div><div><b>${nA}</b><span>aulas visitadas · ${nJ} jornadas</span></div>
 <div><b>${hrs.toFixed(1).replace('.',',')} h</b><span>de recorrido</span></div><div><b>${fmt(TOT-U.tot)}</b><span>estudiantes por alcanzar</span></div></div>`;
 // matriz carrera x semestre
 const pc=(ci,cur)=>{const k=ci+'|'+cur;if(!COH.has(k))return null;return 1-(U.coh.get(k)??1)};
 h+=`<div class="k"><h4>${ic('grid')}Alcance por carrera y semestre</h4><div class="mxw"><table class="mx"><thead><tr><th></th>${CURS.map(c=>`<th>${c}</th>`).join('')}<th>Total</th></tr></thead><tbody>`+
 DATA.C.map((c,ci)=>{const tc=DATA.CM[ci][2],a=U.car[ci]||0;return `<tr><td class="n">${esc(DATA.CN[ci])}</td>${CURS.map(cu=>{const p=pc(ci,String(cu));if(p===null)return'<td style="background:#f6f7f9;color:#c4cbd3">·</td>';const q=Math.round(p*100);return`<td style="background:rgba(14,159,176,${(.08+p*.85).toFixed(2)});color:${p>.55?'#fff':'#1f2933'}">${q}</td>`}).join('')}<td style="background:var(--soft)">${tc?Math.round(a/tc*100):0}%</td></tr>`}).join('')+
 `</tbody></table></div><p class="s" style="margin:8px 0 0">% de estudiantes de cada semestre alcanzados. Gris: sin clases en el horario.</p></div>`;
 // por carrera
 h+=`<div class="k"><h4>${ic('cap')}Por carrera</h4>${DATA.C.map((c,ci)=>{const t=DATA.CM[ci][2],a=U.car[ci]||0;return`<div class="row"><div><span>${esc(DATA.CN[ci])}</span><b>${t?Math.round(a/t*100):0}% <span class="s">· ${fmt(a)}/${fmt(t)}</span></b></div><div class="bar"><i style="width:${t?Math.min(100,a/t*100):0}%;background:${CC[ci%CC.length]}"></i></div></div>`}).join('')}</div>`;
 // por día de la semana
 const byD={};Object.values(AV).forEach(v=>{const r=R[v.id];if(!r)return;const d=v.t?dowF(v.t.slice(0,10)):r.dow;(byD[d]??={a:0,e:0});byD[d].a++;byD[d].e+=r.n});
 const best=[1,2,3,4,5,6].map(d=>{const bl=[];for(let x=7*60;x<22*60;x+=60){const s=R.filter(r=>r.dow===d&&r.ini<x+60&&r.fin>x&&!AV[r.id]&&!U.covG.has(r.gk)).reduce((s,r)=>s+gain(r),0);bl.push([x,s])}return[d,bl.sort((a,b)=>b[1]-a[1]).slice(0,2)]});
 h+=`<div class="k"><h4>${ic('cal')}Por día</h4><table class="mx" style="border-spacing:0 4px"><thead><tr><th style="text-align:left">Día</th><th>Aulas</th><th>Est. en aula</th><th style="text-align:left">Mejor hora pendiente</th></tr></thead><tbody>${best.map(([d,bl])=>`<tr><td class="n">${DN[d]}</td><td style="font-weight:700">${byD[d]?.a||0}</td><td>${fmt(byD[d]?.e||0)}</td><td style="text-align:left;font-weight:500">${bl.filter(x=>x[1]>1).map(([x,s])=>`${hm(x)} <span class="s">(+${fmt(s)})</span>`).join(' · ')||'<span class="s">–</span>'}</td></tr>`).join('')}</tbody></table></div>`;
 h+=`<div class="warn">${ic('alert',18)}<span>Mecatrónica tiene ${DATA.CM[DATA.CN.indexOf('Mecatrónica')]?.[2]||0} estudiantes pero solo ${R.filter(r=>r.car==='Mecatrónica').length} clases en el horario: sus materias comunes pueden figurar en otra carrera.</span></div>`;
 h+=`<details><summary>${ic('user')}Decanato 2026–2030</summary><p class="s">Único candidato habilitado: <b>Germán Palacios Márquez</b>. Franklin Torres Espada quedó inhabilitado (Res. Electoral 002/2026). Elección: viernes 6 de noviembre.</p></details>`;
 $('#v-res').innerHTML=h;
}

/* ---------- JORNADAS ---------- */
function vJor(){
 let h=`<div class="k"><h4>${ic('walk')}Nueva jornada</h4><div class="f3"><div><label class="lab">Fecha</label><input id="jf" type="date" value="${today()}"></div><div><label class="lab">Desde</label><input id="ja" type="time" value="08:30"></div><div><label class="lab">Hasta</label><input id="jb" type="time" value="11:00"></div></div>
 <p class="s" style="margin:8px 0">${AULA_MIN} min por aula + ${PASILLO} min de pasillo. Se eligen las aulas con más estudiantes nuevos en clase a cada hora.</p>
 <div style="display:flex;gap:6px"><button class="c" style="flex:1" onclick="previa()">${ic('bolt',16)} Calcular aulas</button>${prev?`<button class="p" style="flex:1" onclick="guardarPrevia()">${ic('check',16,2.5)} Guardar</button>`:''}</div>
 ${prev?`<div style="margin-top:10px">${prev.l.length?prev.l.map(x=>{const r=R[x.id];return`<div class="it" style="border:1px solid var(--line);border-radius:8px;margin:5px 0"><span class="h">${hm(x.t)}</span><span class="x1"><b>Aula ${esc(r.aula)} · ${esc(r.car)} ${esc(r.cur)}.º</b><span>${esc(r.mat)} · Gr. ${esc(r.gr)} ${esc(r.tg)} · ${r.n} est.</span></span><span class="chip cy">+${fmt(x.g)}</span></div>`}).join(''):'<p class="s">No hay clases en ese horario.</p>'}</div>`:''}</div>`;
 const L=Object.values(J).sort((a,b)=>(b.fecha+hm(b.ini)).localeCompare(a.fecha+hm(a.ini)));
 if(!L.length)h+='<div class="e">Sin jornadas.</div>';
 for(const j of L){const vis=j.ids.map(id=>AV[id]).filter(Boolean),est=vis.reduce((s,v)=>s+(R[v.id]?.n||0),0),d=new Date(j.fecha+'T12:00:00');
  h+=`<div class="jo"><div class="jh"><div class="d"><span>${DN[d.getDay()]}</span><b>${d.getDate()}</b><span>${MES[d.getMonth()]}</span></div><div class="i"><b>${hm(j.ini)} – ${hm(j.fin)}</b><div>${vis.length} aulas · ${fmt(est)} estudiantes en aula</div></div>
  <button title="Recalcular" onclick="recalcular('${j.id}')">${ic('bolt',16)}</button><button class="x" title="Borrar" onclick="borrarJornada('${j.id}')">${ic('trash',16)}</button></div>
  ${vis.sort((a,b)=>(a.slot||0)-(b.slot||0)).map(v=>{const r=R[v.id];return`<div class="it"><span class="h">${hm(v.slot??r.ini)}</span><span class="x1"><b>Aula ${esc(r.aula)} · ${esc(r.car)} ${esc(r.cur)}.º</b><span>${esc(r.mat)} · Gr. ${esc(r.gr)} ${esc(r.tg)} · ${r.n} est.</span></span>${v.est?'<span class="chip est">Est.</span>':'<span class="chip ok">OK</span>'}
  <button title="${v.est?'Confirmar':'Marcar estimada'}" onclick="confirmar(${v.id})">${ic('check',15,2.5)}</button><button title="Cambiar" onclick="cambiarOpen(${v.id})">${ic('swap',15)}</button><button title="Quitar" onclick="quitarAula(${v.id})">${ic('x',15)}</button></div>`}).join('')}</div>`}
 $('#v-jor').innerHTML=h;
}
function previa(){const f=$('#jf').value,a=mins($('#ja').value),b=mins($('#jb').value);if(!f||b<=a)return toast('Revisa la fecha y las horas');prev={f,a,b,l:estimar(f,a,b,AV)};vJor()}
function guardarPrevia(){if(!prev)return;guardarJornada(prev.f,prev.a,prev.b,prev.l);prev=null;toast('Jornada guardada')}

/* ---------- HORARIO ---------- */
function vHor(){
 const L=R.filter(r=>r.dow===hd&&(hc===''||r.ci===+hc)&&(hs===''||r.cur===hs)&&(ht===''||r.tg===ht)).sort((a,b)=>a.ini-b.ini||b.n-a.n);
 const est=L.reduce((s,r)=>s+r.n,0);
 let h=`<div class="k"><div class="seg" style="margin-top:0">${[1,2,3,4,5,6].map(d=>`<button class="${hd===d?'on':''}" onclick="hd=${d};vHor()">${DN[d]}</button>`).join('')}</div>
 <div class="f3" style="grid-template-columns:1.3fr 1fr 1fr"><select onchange="hc=this.value;vHor()"><option value="">Carrera</option>${DATA.CN.map((c,i)=>`<option value="${i}" ${hc===String(i)?'selected':''}>${esc(c)}</option>`).join('')}</select>
 <select onchange="hs=this.value;vHor()"><option value="">Semestre</option>${CURS.map(c=>`<option ${hs===String(c)?'selected':''} value="${c}">${c}.º</option>`).join('')}</select>
 <select onchange="ht=this.value;vHor()"><option value="">Tipo</option>${['Teo','Prac','Lab'].map(t=>`<option ${ht===t?'selected':''}>${t}</option>`).join('')}</select></div>
 <p class="s" style="margin:8px 0 0">${L.length} clases · ${fmt(est)} estudiantes en aula</p></div>`;
 let blk=-1;for(const r of L){const b=Math.floor(r.ini/60);if(b!==blk){blk=b;h+=`<div class="hd">${hm(b*60)}</div>`}h+=clase(r)}
 if(!L.length)h+='<div class="e">Sin clases con estos filtros.</div>';

/* ---------- AHORA ---------- */
function vAho(){
 const d=new Date(),dw=d.getDay(),t=nowM();
 const L=R.filter(r=>r.dow===dw&&r.ini<=t+15&&r.fin-AULA_MIN>=t&&!AV[r.id]&&!U.covG.has(r.gk)).map(r=>({r,g:gain(r)})).filter(x=>x.g>0.5).sort((a,b)=>b.g-a.g);
 const tot=R.filter(r=>r.dow===dw&&r.ini<=t&&r.fin>t).reduce((s,r)=>s+r.n,0);
 $('#v-aho').innerHTML=`<div class="k"><h4>${ic('clock')}${DN[dw]} ${hm(t)}</h4><div class="kp" style="margin:0"><div class="hl"><b>${fmt(tot)}</b><span>estudiantes en clase ahora</span></div><div><b>${L.length}</b><span>aulas por visitar</span></div></div></div>`
  +(L.slice(0,20).map(x=>clase(x.r,{g:x.g})).join('')||'<div class="e">Nada pendiente en este momento.</div>');

/* ---------- AJUSTES ---------- */
const RULES=`rules_version = '2';\nservice cloud.firestore {\n  match /databases/{database}/documents {\n    match /meca_jornadas/{id} { allow read, write: if true; }\n  }\n}`;
function vCfg(){const c=fbConfig();
 $('#v-cfg').innerHTML=`<div class="k"><h4>${ic('db')}Nube (Firebase)</h4><p class="s" style="margin:0 0 8px">${c?'Proyecto <b>'+esc(c.projectId)+'</b>':'Sin configurar: los datos quedan en este celular.'}</p><textarea id="fbTx" rows="4" placeholder="Pega el bloque firebaseConfig"></textarea><div style="display:flex;gap:6px;margin-top:8px"><button class="p" style="flex:1" onclick="fbSave()">Guardar y conectar</button>${c&&!FB_CONFIG?'<button onclick="localStorage.removeItem(\'mc_fb\');location.reload()">Quitar</button>':''}</div></div>
 <details><summary>${ic('shield')}Reglas de Firestore</summary><pre>${esc(RULES)}</pre><button onclick="navigator.clipboard.writeText(RULES).then(()=>toast('Copiado'))">Copiar</button></details>
 <div class="k"><h4>${ic('dl')}Exportar</h4><button style="width:100%" onclick="csv()">Aulas visitadas (CSV)</button></div>
 <details><summary>${ic('trash')}Reiniciar</summary><p class="s">Borra jornadas y aulas y vuelve a cargar las jornadas iniciales.</p><button class="x" onclick="reiniciar()">Reiniciar</button></details>`}

function csv(){const H=['fecha','hora','estado','aula','carrera','semestre','materia','grupo','tipo','docente','estudiantes','jornada'];
 const rows=Object.values(AV).map(v=>{const r=R[v.id];const j=J[v.j];return[v.t?.slice(0,10)||'',hm(v.slot??r.ini),v.est?'estimada':'confirmada',r.aula,r.car,r.cur,r.mat,r.gr,r.tg,r.doc,r.n,j?hm(j.ini)+'-'+hm(j.fin):'suelta']});
 const s='﻿'+[H,...rows].map(a=>a.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([s],{type:'text/csv'}));a.download='ficam_visitas.csv';a.click()}
function reiniciar(){if(prompt('Escribe BORRAR para reiniciar')!=='BORRAR')return;const ids=Object.keys(J);J={};AV={};LS.s('mc_seed',0);keep();ids.forEach(sync_);syncSueltas();sembrar();derive()}

/* ---------- base ---------- */
const NAV=[['res','home','Resumen'],['jor','walk','Jornadas'],['hor','cal','Horario'],['aho','zap','Ahora'],['cfg','gear','Ajustes']];
function status(txt){const e=$('#st'),c=fbConfig(),off=!navigator.onLine||!F||cache;e.className=off||pend?'w':'';e.textContent=txt||(!navigator.onLine?'Sin internet':!c?'Local':!F?'Conectando':cache?'Sin nube':pend?'Guardando':'En línea')}
function draw(){$('#nav').innerHTML=NAV.map(([k,i,l])=>`<button data-t="${k}" class="${tab===k?'on':''}">${ic(i,21)}${l}</button>`).join('');status();({res:vRes,jor:vJor,hor:vHor,aho:vAho,cfg:vCfg})[tab]()}

sembrar();derive();
